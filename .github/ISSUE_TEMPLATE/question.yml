name: Question
description: Ask about setup, configuration or expected behaviour
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome here - this tracker is the single place where I follow them.

        Two things worth reading first, because they answer a large share of what gets asked:
        the [README](https://github.com/dasimon135/ha-edifice#readme) and [Compatibility](https://github.com/dasimon135/ha-edifice#compatibility).

        **This is a school account and issues are public.** Never paste your username or password,
        your children's names, the content of a homework item or of a note, or a session cookie.
        Leave out any link that contains an identifier.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what is unclear or not behaving as you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
      placeholder: "HA 2026.9.3, integration 0.3.1"
    validations:
      required: false
  - type: input
    id: ent-address
    attributes:
      label: ENT address
      description: The public address only, as you type it in a browser.
      placeholder: "https://ent.parisclassenumerique.fr"
    validations:
      required: false
